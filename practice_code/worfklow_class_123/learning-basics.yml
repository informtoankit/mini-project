name: Learning Basics

on:
  push:
    branches:
      - main
      - dev
      - qa

  pull_request:
    branches:
      - main
      - dev
      - qa

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: sample
  STAGE: dev

jobs:
  tooling:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # GitHub Context
      - name: Print GitHub Context
        run: echo '${{ toJson(github) }}'

      # Job Context
      - name: Print Job Context
        run: echo '${{ toJson(job) }}'

      # Workflow Variables
      - name: Print Workflow Variables
        run: |
          echo "APP_NAME=${{ env.APP_NAME }}"
          echo "STAGE=${{ env.STAGE }}"
          echo "Triggered By=$GITHUB_ACTOR"

      # Default GitHub Variables
      - name: Default GitHub Variables
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "RUNNER_OS=$RUNNER_OS"

      # Workspace
      - name: Workspace Information
        run: |
          pwd
          ls -la

      # Create Variable
      - name: Create SHORT_SHA
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      # Use Variable
      - name: Print SHORT_SHA
        run: echo "$SHORT_SHA"

      # Main branch only
      - name: Main Branch Logic
        if: ${{ github.ref == 'refs/heads/main' }}
        run: echo "Running on Main"

      # OS
      - name: OS Information
        run: uname -a

      # Node
      - name: Node Version
        run: |
          node -v
          npm -v

      # Python
      - name: Python Version
        run: |
          python3 --version
          pip3 --version

      # Go
      - name: Go Version
        run: go version

      # Docker
      - name: Docker Version
        run: docker --version